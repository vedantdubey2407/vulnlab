name: SecuScan Security Checks

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install application and audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pip-audit

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run custom Semgrep rules
        continue-on-error: true
        run: |
          mkdir -p artifacts
          semgrep scan --config semgrep-rules --json --output artifacts/semgrep.json app

      - name: Start vulnerable FastAPI lab
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > artifacts/uvicorn.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/uvicorn.log
          exit 1

      - name: Install Go for Nuclei
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install Nuclei
        run: go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest

      - name: Run custom Nuclei templates
        continue-on-error: true
        run: |
          mkdir -p artifacts
          "$(go env GOPATH)/bin/nuclei" -u http://127.0.0.1:8000 \
            -t nuclei-templates \
            -severity high,critical \
            -json-export artifacts/nuclei.json

      - name: Run pip-audit
        continue-on-error: true
        run: pip-audit -r app/requirements.txt --format json --output artifacts/pip-audit.json

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.28.0"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        continue-on-error: true
        run: |
          gitleaks detect --source . --redact --report-format json --report-path artifacts/gitleaks.json --exit-code 1

      - name: Security gate and summary
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path

          root = Path("artifacts")
          failures = []

          semgrep = root / "semgrep.json"
          if semgrep.exists():
              data = json.loads(semgrep.read_text())
              high = [r for r in data.get("results", []) if r.get("extra", {}).get("severity") in {"ERROR", "CRITICAL"}]
              if high:
                  failures.append(f"Semgrep: {len(high)} high/critical finding(s)")

          nuclei = root / "nuclei.json"
          if nuclei.exists():
              lines = [x for x in nuclei.read_text().splitlines() if x.strip()]
              if lines:
                  failures.append(f"Nuclei: {len(lines)} high/critical finding(s)")

          audit = root / "pip-audit.json"
          if audit.exists():
              data = json.loads(audit.read_text())
              vulns = data.get("vulnerabilities", [])
              high = [v for v in vulns if any((fix.get("severity") or "").upper() in {"HIGH", "CRITICAL"} for fix in v.get("fix_versions", []))]
              if vulns:
                  failures.append(f"pip-audit: {len(vulns)} vulnerable dependency record(s)")

          gitleaks = root / "gitleaks.json"
          if gitleaks.exists():
              lines = [x for x in gitleaks.read_text().splitlines() if x.strip()]
              if lines:
                  failures.append(f"gitleaks: {len(lines)} secret finding(s)")

          print("=== SecuScan security summary ===")
          if failures:
              for item in failures:
                  print(f"FAIL: {item}")
              raise SystemExit(1)
          print("PASS: no configured high-severity findings")
          PYTHON

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secuscan-results
          path: artifacts/
